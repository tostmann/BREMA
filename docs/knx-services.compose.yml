# The two services a busware KNX stick (firmware MCP4KNX) finds and forwards:
#   knxprod-mcp     product data from the .knxprod files you put into ./knxprod
#   knxproject-mcp  the record of your installation, in the volume knxproject-data
# Linux with Docker. Before the first start:
#   mkdir -p knxprod knxprod-index import
#   KNXPROD_UID=$(id -u) KNXPROD_GID=$(id -g) docker compose -f knx-services.compose.yml up -d
# More: https://github.com/tostmann/knxprod-mcp
#       https://github.com/tostmann/knxproject-mcp
services:
  knxprod-mcp:
    image: tostmann/knxprod-mcp:latest
    # Host networking lets the stick find both services via DNS-SD. Without it
    # (Docker Desktop, for example): remove both network_mode and *_BIND lines,
    # publish the ports ("8095:8095", "8096:8096"), enter the two URLs on the
    # stick's page and set KNXPROJECT_STICK_URL below.
    network_mode: host
    # The owner of ./knxprod and ./knxprod-index (uploads land in ./knxprod).
    user: "${KNXPROD_UID:-1000}:${KNXPROD_GID:-1000}"
    volumes:
      - ./knxprod:/knxprod
      - ./knxprod-index:/data
    environment:
      KNXPROD_BIND: auto
    restart: unless-stopped

  knxproject-mcp:
    image: tostmann/knxproject-mcp:latest
    network_mode: host
    volumes:
      - knxproject-data:/data
      # Files to import (ESF export, Home Assistant configuration, ...), read only.
      - ./import:/import:ro
    environment:
      KNXPROJECT_BIND: auto
      # Created at the first start; a record that holds an installation is left as it is.
      KNXPROJECT_INSTALLATION: home
      KNXPROJECT_INSTALLATION_NAME: "My KNX installation"
      # The stick's admin password, if it has one (proj-read-device needs it).
      KNXPROJECT_STICK_TOKEN: ""
      # Only without host networking: the stick's URL, e.g. http://192.168.1.20/mcp
      KNXPROJECT_STICK_URL: ""
    restart: unless-stopped

volumes:
  knxproject-data:
